[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-sam"
version = "0.1.0"
description = "Echo-SAM: Zero-Shot Learning of Unseen Structures via Medical Knowledge Graph Grounding"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Jiewen Yang"}, {name = "Xiaomeng Li"}]
dependencies = [
    "torch>=2.7", "torchvision>=0.22", "timm>=1.0.17",
    "numpy>=1.26,<2", "pillow", "tqdm", "ftfy==6.1.1", "regex",
    "iopath>=0.1.10", "typing_extensions", "huggingface_hub",
    "einops", "decord", "pycocotools", "scipy", "psutil",
]

[project.optional-dependencies]
train = [
    "hydra-core>=1.3", "submitit", "tensorboard", "torchmetrics",
    "fvcore", "fairscale", "scikit-image", "scikit-learn", "matplotlib",
    "opencv-python<4.12", "pandas", "numba", "python-rapidjson", "networkx",
]
dev = ["pytest", "build"]

[project.urls]
Repository = "https://github.com/xmed-lab/Echo-SAM"

[tool.setuptools.packages.find]
include = ["sam3*"]

[tool.setuptools.package-data]
sam3 = ["assets/*.txt.gz", "train/configs/**/*.yaml", "train/configs/**/*.json", "agent/system_prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
