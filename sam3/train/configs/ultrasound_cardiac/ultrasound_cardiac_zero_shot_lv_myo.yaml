# @package _global_
defaults:
  - _self_

# ============================================================================
# Paths Configuration (Chage this to your own paths)
# ============================================================================
paths:
  ultrasound_cardiac_root: ${oc.env:ECHO_SAM_DATA_ROOT,./data/UltrasoundCardiac}
  experiment_log_dir: ${oc.env:ECHO_SAM_OUTPUT_DIR,./outputs/zero_shot_lv_myo}
  bpe_path: ./sam3/assets/bpe_simple_vocab_16e6.txt.gz
  checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  ultrasound_cardiac_knowledge: ./sam3/train/configs/ultrasound_cardiac/ultrasound_cardiac_knowledge.json

# Few-shot Learning Configuration
few_shot:
  enable: False  # Set to True to enable few-shot training
  num_support_shots: 1  # Number of support images per category (1, 2, ..., N)
  sample_support_from_same_category: True  # Whether to sample support images from the same category as query
  support_set_shuffle: True  # Whether to shuffle support set
  # Support datasets configuration - each with FULL configuration
  support_datasets:
    - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
      limit_ids: ${ultrasound_cardiac_train.num_images}
      transforms: ${ultrasound_cardiac_train.train_transforms}
      load_segmentation: ${scratch.enable_segmentation}
      max_ann_per_img: 500000
      multiplier: 1
      max_train_queries: 50000
      max_val_queries: 50000
      training: true
      use_caching: False
      img_folder: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.support.img_folder}
      ann_file: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.support.json}
      coco_json_loader:
        _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
        prompts: ${ultrasound_cardiac_prompts.${ultrasound_cardiac_train.supercategory_tuple.name}}
        _partial_: true

# Roboflow dataset configuration
ultrasound_cardiac_train:
  num_images: null # Note: This is the number of images used for training. If null, all images are used.
  supercategory_tuple: ${all_ultrasound_cardiac_supercategories.${string:${submitit.job_array.task_index}}}

  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        # - _target_: sam3.train.transforms.basic_for_api.RandomRotate
        #   degrees: 15
        #   p: 0.5
        #   consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ColorJitter
          consistent_transform: ${scratch.consistent_transform}
          brightness: 0.3
          contrast: 0.3
          saturation: 0.0
          hue: 0.0
        - _target_: sam3.train.transforms.basic_for_api.RandomGaussianBlur
          consistent_transform: ${scratch.consistent_transform}
          kernel_size:
            - 5
            - 7
          sigma:
            - 0.1
            - 2.0
          p: 0.5
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline（需在 resize 前解码 RLE，否则 segment 为 dict 会 KeyError）
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # loss config (no mask loss)
  # loss:
  #   _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
  #   matcher: ${scratch.matcher}
  #   o2m_weight: 2.0
  #   o2m_matcher:
  #     _target_: sam3.train.matcher.BinaryOneToManyMatcher
  #     alpha: 0.3
  #     threshold: 0.4
  #     topk: 4
  #   use_o2m_matcher_on_o2m_aux: false # Another option is true
  #   loss_fns_find:
  #     - _target_: sam3.train.loss.loss_fns.Boxes
  #       weight_dict:
  #         loss_bbox: 5.0
  #         loss_giou: 2.0
  #     - _target_: sam3.train.loss.loss_fns.IABCEMdetr
  #       weak_loss: False
  #       weight_dict:
  #         loss_ce: 20.0 # Another option is 100.0
  #         presence_loss: 20.0
  #       pos_weight: 10.0 # Another option is 5.0
  #       alpha: 0.25
  #       gamma: 2
  #       use_presence: True  # Change
  #       pos_focal: false
  #       pad_n_queries: 200
  #       pad_scale_pos: 1.0

  #   loss_fn_semantic_seg: null
  #   scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}


  # NOTE: Loss to be used for training in case of segmentation
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0 # Another option is 100.0
          presence_loss: 20.0
        pos_weight: 10.0 # Another option is 5.0
        alpha: 0.25
        gamma: 2
        use_presence: True  # Change
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0      
          loss_dice: 10.0
        compute_aux: false
      - _target_: sam3.train.loss.medical_aux_loss.MedicalAuxLoss
        knowledge_config_path: ${paths.ultrasound_cardiac_knowledge}
        # Few-Shot 损失配置
        use_few_shot_loss: False
        # few_shot_proto_weight: 0.2
        # few_shot_contrastive_weight: 0.1
        use_pseudo_labels: True  # 启用Bbox伪标签损失
        pseudo_label_weight: 0.1      # 整体伪标签损失权重
        loss_mask_weight: 0.1 
    loss_fn_semantic_seg: null
    # 若需启用，建议权重很小：loss_semantic_seg 2~5，loss_semantic_dice 2~5
    # loss_fn_semantic_seg:
    #   _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
    #   presence_head: True
    #   presence_loss: False
    #   focal: True
    #   focal_alpha: 0.6
    #   focal_gamma: 2.0
    #   downsample: False
    #   weight_dict:
    #     loss_semantic_seg: 3.0
    #     loss_semantic_presence: 1.0
    #     loss_semantic_dice: 3.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Different helper parameters and functions
# ============================================================================
scratch:
  enable_segmentation: True # NOTE: This is the number of queries used for segmentation
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: False
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1  # infinite detections
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: False  # with `focal: true` it is equivalent to BinaryFocalHungarianMatcher
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True

  # Image processing parameters
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 10
  num_val_workers: 0
  max_data_epochs: 20
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 1
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: ultrasound_cardiac
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

  gradient_accumulation_steps: 1
  train_batch_size: 1
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!
    enable_few_shot: ${few_shot.enable}

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:

  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: False  # true 会跳过保存，需设为 false 才能按 save_freq 保存 checkpoint
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: 10
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${ultrasound_cardiac_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.few_shot_dataset.build_few_shot_dataset
        # Main dataset (will be auto-instantiated by Hydra)
        main_dataset:
          _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
          limit_ids: ${ultrasound_cardiac_train.num_images}
          transforms: ${ultrasound_cardiac_train.train_transforms}
          load_segmentation: ${scratch.enable_segmentation}
          max_ann_per_img: 500000
          multiplier: 1
          max_train_queries: 50000
          max_val_queries: 50000
          training: true
          use_caching: False
          img_folder: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.train.img_folder}
          ann_file: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.train.json}
          coco_json_loader:
            _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
            prompts: ${ultrasound_cardiac_prompts.${ultrasound_cardiac_train.supercategory_tuple.name}}
            _partial_: true
        # Support datasets (will be auto-instantiated by Hydra)
        support_datasets: []  # Zero-shot: do not load support annotations.
        # Few-shot learning parameters
        num_support_shots: ${few_shot.num_support_shots}
        sample_support_from_same_category: ${few_shot.sample_support_from_same_category}
        support_set_shuffle: ${few_shot.support_set_shuffle}
        enable_few_shot: ${few_shot.enable}

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          # category_chunk_size # 不设置 category_chunk_size，使每张图所有结构（N 个或全部 concept）在同一 batch 出现
          _partial_: true
        img_folder: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.val.img_folder}
        ann_file: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.val.json}
        transforms: ${ultrasound_cardiac_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}


  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    checkpoint_path: ${paths.checkpoint_path}
    device: cpu
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation} # Warning: Enable this if using segmentation.
    use_medical_wrapper: True
    medical_knowledge_config_path: ${paths.ultrasound_cardiac_knowledge}
    # Few-Shot 学习配置
    use_few_shot: False
    # LoRA 配置
    use_lora: False
    lora_rank: 8
    lora_alpha: 16.0
    lora_dropout: 0.0
    lora_target_modules: ["attn", "mlp"]

  meters:
    val:
      ultrasound_cardiac:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/ultrasound_cardiac/${ultrasound_cardiac_train.supercategory_tuple.name}
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 5000  # 16类×200 query=3200条/图；必须足够大，否则低分类别（如零样本LV）被截断
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.val.json}
              tide: False
              iou_type: "bbox"
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.ultrasound_cardiac_root}/${ultrasound_cardiac_train.supercategory_tuple.val.json}
              iou_type: "segm"

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:  # transformer and class_embed
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1  # 0 only last checkpoint is saved.

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/${ultrasound_cardiac_train.supercategory_tuple.name}
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${oc.env:ECHO_SAM_OUTPUT_DIR,./outputs/zero_shot_lv_myo}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: True
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
  # Uncomment for job array configuration
  job_array:
    num_tasks: 0
    task_index: 0

# ============================================================================
